[package]
name = "dagomapp"
version = "0.2.61"
description = "DagomApp"
authors = ["Dagoma"]
edition = "2021"
publish = false

[lib]
name = "dagomapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embed the frontend, so a plain `cargo build` gives a standalone app.
# `cargo tauri dev` disables it to load the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dagomapp-frontend = { path = "../tools/frontend" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
